{% extends "ogloszenia/base.html" %}


{% block title %}
Produkty
{% endblock %}


{% block content %}

<h2>Lista produktów</h2>

<ul>
    {% for product in products %}
        <li>
            {{ product.name }} - {{ product.price }} zł
            <br>
            {{ product.description }}
        </li>
    {% endfor %}
</ul>

{% endblock %}
