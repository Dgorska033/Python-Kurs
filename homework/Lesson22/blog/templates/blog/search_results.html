<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <title>Wyniki wyszukiwania</title>
</head>

<body>

    <h1>Wyniki wyszukiwania</h1>

    <p>Szukana fraza: <strong>{{ query }}</strong></p>

    <ul>
        {% for post in posts %}

            <li>
                <strong>{{ post.title }}</strong>
                <br>
                {{ post.content }}
            </li>

        {% empty %}

            <li>Nie znaleziono żadnych postów.</li>

        {% endfor %}
    </ul>

    <br>

    <a href="{% url 'home' %}">Powrót na stronę główną</a>

</body>

</html>
